# SLURM profile — SMALL tier (≤ 20 samples)
# Single concurrent job; serial per-sample execution. Debug-friendly.

executor: slurm
jobs: 1
max-jobs-per-second: 1
max-status-checks-per-second: 1
restart-times: 2
latency-wait: 30

# Default per-rule SLURM resources. Rules override via `resources:` blocks.
default-resources:
  # Cluster-specific: these are UC Davis FARM values. Change them for your
  # site, or the scheduler will reject every job.
  - slurm_account=publicgrp
  - slurm_partition=low
  - slurm_qos=publicgrp-low-qos
  - requeue=true
  # Email notifications are off by default: a hardcoded address would mail
  # this pipeline's author about YOUR jobs. Uncomment and set your own.
  # - slurm_extra="--mail-type=END,FAIL --mail-user=you@example.edu"
  - runtime=60
  - mem_mb=4000
  - tmpdir="tmp"

# Quality of life
printshellcmds: true
keep-going: false
rerun-incomplete: true
use-conda: false
