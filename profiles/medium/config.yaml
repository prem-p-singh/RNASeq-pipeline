# SLURM profile — MEDIUM tier (21-200 samples)
# Up to 20 concurrent per-sample jobs. Sweet spot for most projects.

executor: slurm
jobs: 20
max-jobs-per-second: 2
max-status-checks-per-second: 5
restart-times: 2
latency-wait: 30

default-resources:
  # Uses scheduler defaults. Uncomment and set values required by your site.
  # - slurm_account=YOUR_ACCOUNT
  # - slurm_partition=YOUR_PARTITION
  # - slurm_qos=YOUR_QOS
  - requeue=true
  # Email notifications are off by default: a hardcoded address would mail
  # this pipeline's author about YOUR jobs. Uncomment and set your own.
  # - slurm_extra="--mail-type=END,FAIL --mail-user=you@example.edu"
  - runtime=60
  - mem_mb=6000
  - tmpdir="tmp"

printshellcmds: true
keep-going: true          # keep running surviving samples if one fails
rerun-incomplete: true
use-conda: false
