# SLURM profile — MEDIUM tier (21-200 samples)
# Up to 20 concurrent per-sample jobs. Sweet spot for most projects.

executor: slurm
jobs: 20
max-jobs-per-second: 2
max-status-checks-per-second: 5
restart-times: 2
latency-wait: 30

default-resources:
  - slurm_account=publicgrp
  - slurm_partition=low
  - slurm_qos=publicgrp-low-qos
  - requeue=true
  - slurm_extra="--mail-type=END,FAIL --mail-user=ppssingh@ucdavis.edu"
  - runtime=60
  - mem_mb=6000
  - tmpdir="tmp"

printshellcmds: true
keep-going: true          # keep running surviving samples if one fails
rerun-incomplete: true
use-conda: false
