<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 324" width="1200" height="324" role="img" aria-label="Quick start in a terminal: clone the release, install the environment, set up from the Excel intake, then run with submit.sh"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1D2621"/><stop offset="55%" stop-color="#22302A"/><stop offset="100%" stop-color="#285F47"/></linearGradient></defs><style>.l0{animation:t0 20.0s steps(77,end) infinite}@keyframes t0{0%,3.00%{clip-path:inset(0 100% 0 0)}16.48%,96%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}.p0{animation:f0 20.0s linear infinite}@keyframes f0{0%,2.25%{opacity:0}3.00%,96%{opacity:1}100%{opacity:0}}.l1{animation:f1 20.0s linear infinite}@keyframes f1{0%,18.23%{opacity:0}19.48%,96%{opacity:1}100%{opacity:0}}.l2{animation:t2 20.0s steps(41,end) infinite}@keyframes t2{0%,22.73%{clip-path:inset(0 100% 0 0)}29.90%,96%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}.p2{animation:f2 20.0s linear infinite}@keyframes f2{0%,21.98%{opacity:0}22.73%,96%{opacity:1}100%{opacity:0}}.l3{animation:f3 20.0s linear infinite}@keyframes f3{0%,31.65%{opacity:0}32.90%,96%{opacity:1}100%{opacity:0}}.l4{animation:t4 20.0s steps(83,end) infinite}@keyframes t4{0%,36.15%{clip-path:inset(0 100% 0 0)}50.68%,96%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}.p4{animation:f4 20.0s linear infinite}@keyframes f4{0%,35.40%{opacity:0}36.15%,96%{opacity:1}100%{opacity:0}}.l5{animation:f5 20.0s linear infinite}@keyframes f5{0%,52.43%{opacity:0}53.68%,96%{opacity:1}100%{opacity:0}}.l6{animation:t6 20.0s steps(42,end) infinite}@keyframes t6{0%,56.93%{clip-path:inset(0 100% 0 0)}64.28%,96%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}.p6{animation:f6 20.0s linear infinite}@keyframes f6{0%,56.18%{opacity:0}56.93%,96%{opacity:1}100%{opacity:0}}.l7{animation:f7 20.0s linear infinite}@keyframes f7{0%,66.03%{opacity:0}67.28%,96%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){text{animation:none!important;clip-path:none!important;opacity:1!important}}</style><rect width="1200" height="324" rx="12" fill="url(#bg)"/><rect x="16" y="14" width="1168" height="296" rx="10" fill="#10181A" stroke="#3A4A42"/><circle cx="38" cy="34" r="5" fill="#C0613F"/><circle cx="56" cy="34" r="5" fill="#C9A14A"/><circle cx="74" cy="34" r="5" fill="#4E8F78"/><text x="600" y="39" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5D7268" text-anchor="middle">quick start</text><text class="p0" x="36" y="78" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4E8F78">$</text><text class="l0" x="56" y="78" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#E8F0EC" xml:space="preserve">git clone --branch v2.1.1 https://github.com/prem-p-singh/RNASeq-pipeline.git</text><text class="l1" x="56" y="104" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C9A14A" xml:space="preserve"># 1  get the release</text><text class="p2" x="36" y="138" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4E8F78">$</text><text class="l2" x="56" y="138" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#E8F0EC" xml:space="preserve">bash RNASeq-pipeline/scripts/bootstrap.sh</text><text class="l3" x="56" y="164" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C9A14A" xml:space="preserve"># 2  install and verify the locked environment</text><text class="p4" x="36" y="198" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4E8F78">$</text><text class="l4" x="56" y="198" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#E8F0EC" xml:space="preserve">python3 RNASeq-pipeline/scripts/setup.py --intake study.xlsx --project-dir my_study</text><text class="l5" x="56" y="224" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C9A14A" xml:space="preserve"># 3 and 4  read the Excel intake, then review config/config.yaml</text><text class="p6" x="36" y="258" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4E8F78">$</text><text class="l6" x="56" y="258" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#E8F0EC" xml:space="preserve">bash RNASeq-pipeline/submit.sh -d my_study</text><text class="l7" x="56" y="284" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C9A14A" xml:space="preserve"># 5  check, plan and run; repeat the command to resume</text></svg>
