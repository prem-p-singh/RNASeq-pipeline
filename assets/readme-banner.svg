<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="RNA-Seq pipeline: reads to reference-validated evidence, with a preflight gate before any compute">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D2621"/>
      <stop offset="55%" stop-color="#22302A"/>
      <stop offset="100%" stop-color="#285F47"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#397C68" stop-opacity="0"/>
      <stop offset="18%" stop-color="#397C68"/>
      <stop offset="82%" stop-color="#9C482D"/>
      <stop offset="100%" stop-color="#9C482D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="14" fill="url(#bg)"/>

  <!-- helix motif, left -->
  <g stroke="#4E8F78" stroke-width="2.6" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M80 46 C106 62 106 78 80 94 C54 110 54 126 80 142 C106 158 106 174 80 190 C54 206 54 222 80 238"/>
    <path d="M80 46 C54 62 54 78 80 94 C106 110 106 126 80 142 C54 158 54 174 80 190 C106 206 106 222 80 238"/>
  </g>
  <g stroke="#7A5B16" stroke-width="2.2" opacity="0.7" stroke-linecap="round">
    <line x1="62" y1="70" x2="98" y2="70"/>
    <line x1="62" y1="118" x2="98" y2="118"/>
    <line x1="62" y1="166" x2="98" y2="166"/>
    <line x1="62" y1="214" x2="98" y2="214"/>
  </g>

  <text x="176" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="700" fill="#F2F5F3" letter-spacing="0.4">
    RNA-Seq Pipeline
  </text>
  <text x="176" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="17" fill="#A9BEB4">
    Config-driven Snakemake workflow for bulk RNA-seq and 3' TAGseq on SLURM
  </text>

  <rect x="176" y="126" width="880" height="2" fill="url(#rule)"/>

  <!-- stage chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <g>
      <rect x="176" y="148" width="150" height="34" rx="17" fill="#9C482D"/>
      <text x="251" y="170" fill="#FFFFFF" text-anchor="middle">PREFLIGHT</text>
    </g>
    <text x="340" y="170" fill="#7E9389" font-size="15">&#8594;</text>
    <g>
      <rect x="360" y="148" width="132" height="34" rx="17" fill="#285F47" stroke="#4E8F78" stroke-width="1"/>
      <text x="426" y="170" fill="#E8F0EC" text-anchor="middle">REFERENCE</text>
    </g>
    <text x="506" y="170" fill="#7E9389" font-size="15">&#8594;</text>
    <g>
      <rect x="526" y="148" width="150" height="34" rx="17" fill="#285F47" stroke="#4E8F78" stroke-width="1"/>
      <text x="601" y="170" fill="#E8F0EC" text-anchor="middle">QUANTIFY</text>
    </g>
    <text x="690" y="170" fill="#7E9389" font-size="15">&#8594;</text>
    <g>
      <rect x="710" y="148" width="132" height="34" rx="17" fill="#46567D" stroke="#6C7DA6" stroke-width="1"/>
      <text x="776" y="170" fill="#E8ECF4" text-anchor="middle">DIFFERENTIAL</text>
    </g>
    <text x="856" y="170" fill="#7E9389" font-size="15">&#8594;</text>
    <g>
      <rect x="876" y="148" width="180" height="34" rx="17" fill="#46567D" stroke="#6C7DA6" stroke-width="1"/>
      <text x="966" y="170" fill="#E8ECF4" text-anchor="middle">ENRICHMENT + WGCNA</text>
    </g>
  </g>

  <text x="176" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="13.5" fill="#B9CCC2">
    The design is checked for estimability before any data is fetched, so an unfittable model costs seconds, not a cohort of compute.
  </text>
  <text x="176" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="12.5" fill="#93AFA1">
    Green stages have run on real data. Blue stages are implemented and not yet executed end to end.
  </text>
</svg>
