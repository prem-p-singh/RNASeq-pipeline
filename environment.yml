# Maintainer solve specification; installations use the exact release lock in
# environments/linux-64.explicit.txt (579 packages, URLs/builds/SHA256 hashes).
# On Linux x86_64 with Conda: bash scripts/bootstrap.sh
# FARM: module load conda/latest first. See README.md and docs/RELEASE.md.
# Do not update a qualified runtime in place. To upgrade, solve this file into
# a separate prefix, export `conda list --explicit --sha256`, inspect the diff,
# and rerun the complete Linux release checks before replacing the lock.
# macOS/ARM is not a qualified target for this release.

name: rnaseq-pipeline

channels:
  - conda-forge
  - bioconda

dependencies:
  # --- Python runtime + workflow engine -------------------------------------
  - python=3.12
  - snakemake=9.19.0
  - snakemake-executor-plugin-slurm
  - pandas=2.3.3
  - pyyaml=6.0.3
  - openpyxl=3.1.5

  # --- QC aggregation + reporting (workflow/rules/qc_report.smk) ------------
  - multiqc>=1.25
  - matplotlib>=3.7

  # --- Preprocessing + quantification (Stages 0-1) --------------------------
  # Pinned deliberately to the versions the existing quantifications were
  # produced with. Salmon index format is not portable across major versions,
  # so bumping to 2.x requires rebuilding every index and re-running Stage 1.
  - salmon=1.10.3
  - fastp=0.23.4

  # --- R runtime (Stages 2-5) -----------------------------------------------
  # r-base is intentionally unpinned: the Bioconductor packages below constrain
  # it, and pinning both is the fastest way to an unsolvable environment.
  - r-base
  - r-optparse
  - r-readr
  - r-jsonlite
  - r-dplyr
  - r-tibble
  - r-emmeans
  - r-wgcna=1.74

  # --- Bioconductor ---------------------------------------------------------
  - bioconductor-tximport=1.38.2
  - bioconductor-genomicfeatures
  - bioconductor-txdbmaker=1.6.2
  - bioconductor-annotationdbi
  - bioconductor-annotationforge=1.52.0
  - bioconductor-edger
  - bioconductor-limma
  - bioconductor-variancepartition=1.40.2
  - bioconductor-clusterprofiler=4.18.4
  - bioconductor-gosemsim=2.36.0

  # --- Optional: S3 input ---------------------------------------------------
  # Only needed when samples.tsv points at s3:// URLs. Left out by default so
  # the environment stays smaller; without it an s3:// source fails loudly with
  # "aws: command not found" rather than silently.
  # - awscli
