name: debian-package

# Builds the .deb and smoke-tests `apt install` on every push. On a published
# release it attaches the .deb and, when APT_GPG_PRIVATE_KEY is set, updates the
# signed apt repository on the gh-pages branch.

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "DEB=$(bash packaging/build-deb.sh)" >> "$GITHUB_ENV"
      - name: Install with apt and run the launcher
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y "$DEB"
          rnaseq-pipeline --help | head -3
          /opt/rnaseq-pipeline/conda/bin/conda --version
          sudo apt-get remove -y rnaseq-pipeline
          test ! -e /opt/rnaseq-pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$DEB" --clobber
      - name: Publish apt repository
        if: github.event_name == 'release' && env.APT_GPG_PRIVATE_KEY != ''
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          sudo apt-get install -y -qq apt-utils
          git fetch origin gh-pages:gh-pages || git branch gh-pages $(git commit-tree -m init $(git hash-object -t tree /dev/null))
          git worktree add ../site gh-pages
          bash packaging/publish-apt.sh ../site "$DEB"
          cd ../site
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -m "apt repository for ${{ github.event.release.tag_name }}"
          git push origin gh-pages
