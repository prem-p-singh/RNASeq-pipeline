name: debian-package

# Builds the .deb and smoke-tests `apt install` on every push. On a published
# release it attaches the .deb and, when APT_GPG_PRIVATE_KEY is set, updates the
# signed apt repository on the gh-pages branch.

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "DEB=$(bash packaging/build-deb.sh)" >> "$GITHUB_ENV"
      - name: Install with apt and run the launcher
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y "$DEB"
          rnaseq-pipeline --help | head -3
          /opt/rnaseq-pipeline/conda/bin/conda --version
          sudo apt-get remove -y rnaseq-pipeline
          test ! -e /opt/rnaseq-pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$DEB" --clobber
      - name: Publish apt repository
        if: github.event_name == 'release' && env.APT_GPG_PRIVATE_KEY != ''
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          sudo apt-get install -y -qq apt-utils
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages:gh-pages
            git worktree add ../site gh-pages
          else
            git worktree add --detach ../site
            git -C ../site checkout --orphan gh-pages
            git -C ../site rm -rfq .
          fi
          bash packaging/publish-apt.sh ../site "$DEB"
          cd ../site
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -m "apt repository for ${{ github.event.release.tag_name }}"
          git push origin gh-pages

  apt-repo:
    # Installs from the published apt repository, exactly as the README says.
    runs-on: ubuntu-24.04
    steps:
      - name: Add the repository and install
        run: |
          site=https://prem-p-singh.github.io/RNASeq-pipeline
          curl -fsSL $site/rnaseq-pipeline.gpg | sudo tee /usr/share/keyrings/rnaseq-pipeline.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/rnaseq-pipeline.gpg] $site ./" | sudo tee /etc/apt/sources.list.d/rnaseq-pipeline.list
          sudo apt update && sudo apt install -y rnaseq-pipeline
      - name: Run the installed launcher
        run: |
          rnaseq-pipeline --help | head -3
          /opt/rnaseq-pipeline/conda/bin/conda --version
