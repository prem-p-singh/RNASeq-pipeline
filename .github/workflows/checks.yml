name: lightweight-checks

# Fast feedback. Missing scientific dependencies are reported as skips here.
# release-validation.yml is the separate required zero-skip scientific gate.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python dependencies
        run: python3 -m pip install --quiet pyyaml openpyxl

      - name: Install base R (preflight's estimability check shells out to it)
        run: |
          sudo apt-get update -qq
          # r-cran-jsonlite rather than install.packages(): the runner cannot
          # write to R's site-library, and the prebuilt package skips compiling.
          sudo apt-get install -y -qq r-base-core r-cran-jsonlite
          Rscript -e 'stopifnot(requireNamespace("jsonlite", quietly = TRUE)); cat("jsonlite ok\n")' 

      - name: Shell syntax
        run: |
          for f in submit.sh workflow/scripts/*.sh scripts/*.sh tests/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "all shell scripts parse"

      - name: Python syntax
        run: |
          python3 -m compileall -q scripts workflow/scripts tests
          echo "all python files compile"

      - name: Config templates parse
        run: |
          python3 - <<'PY'
          import yaml, glob
          for f in ["config/config.template.yaml", "config/thresholds.yaml",
                    "config/intake_questions.yaml",
                    "scripts/setup_inputs.template.yaml", "environment.yml"] \
                   + sorted(glob.glob("scripts/presets/*.yaml")) \
                   + sorted(glob.glob("profiles/*/config.yaml")):
              yaml.safe_load(open(f))
              print("ok", f)
          PY

      - name: Self-checks
        run: bash tests/run_all.sh
