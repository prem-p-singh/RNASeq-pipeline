# =============================================================================
# intake_questions.yaml
# -----------------------------------------------------------------------------
# This file defines every question that appears in the intake Excel template.
# Edit it to add, remove, or change questions. After editing, re-run:
#
#     python scripts/generate_intake_template.py
#
# That regenerates intake_template.xlsx with your changes.
#
# Each question has these fields:
#   id        — short name used by the parser (no spaces, letters/digits/underscore)
#   text      — the question shown to the user in plain English
#   help      — example or short explanation shown next to the answer cell
#   type      — "text", "number", or "dropdown"
#   options   — list of choices (only for "dropdown" type; always include
#               "don't know" if probing can answer it later)
#   required  — true / false (required cells are highlighted yellow)
#   default   — pre-filled value shown in the answer cell (optional)
# =============================================================================


# -----------------------------------------------------------------------------
# Questions that appear on EVERY assay tab (project basics, paths, design)
# -----------------------------------------------------------------------------
schema_version: 8
readme:
  - "Fill the Bulk RNA-seq, sRNA-seq or TAGseq tab for your assay. Yellow cells are required; gray cells are optional. Enter literal values, not formulas."
  - "Current execution: annotated, non-UMI bulk QC, gene expression and differential expression; Salmon or STAR; independent groups, batch, subject-blocked or repeated-measures (dream) designs, interactions and continuous covariates."
  - "sRNA-seq launches animal (Bowtie to species mature miRNAs) or plant (ShortStack loci on the genome) small-RNA routes with a named non-UMI kit. TAGseq launches the three named QuantSeq kits (FWD, REV, FWD-UMI) through STAR. Other planned RNA families have no executable intake yet."
  - "Choose external files or workbook tables (workbook tables: Bulk RNA-seq only). For workbook tables, fill Samples, Libraries and Reads; clear the FASTQ folder and external metadata path."
  - "Keep identifiers as Text before entry. One library per sample is executable; multiple run/lane read pairs within that library are checked and merged."
  - "Confirm input stage and whether the library uses UMIs. Unknown UMI status must be resolved; UMI libraries are unsupported by the current bulk route."
  - "Copy the completed workbook, metadata and reads to the analysis host. Relative input paths resolve beside the workbook; file names must match sample IDs."
  - "Prepare the Linux runtime as described in README.md. Setup requires Python with pandas, openpyxl and PyYAML."
  - "Run: python3 scripts/setup.py --intake /path/completed.xlsx --project-dir /path/new_project"
  - "Setup saves your original workbook, its checksum, the sheet/cell source map and normalized inputs under the new project. It will not overwrite an existing project configuration."
  - "Review config/config.yaml and the selected sample sheet: config/samples.tsv for external files, metadata/samples.tsv for workbook tables. Verify the resolved reference and model."
  - "For SLURM, configure your site's profile and run: bash submit.sh -d /path/new_project. See README.md for local Linux execution."
  - "Storage estimates only warn. Actual input, software, scientific-design and filesystem write errors remain failures."
  - "Contact, tissue, platform and kit answers are recorded context. They do not configure notifications, platform-specific trimming or kit-specific processing."
  - "Bulk method, analysis goal, model formula, subject effects, custom references, kit profile, preprocessing and screening have input fields. Optional Contrasts tab: one row per comparison; blank uses generated pairwise contrasts. Executor settings are submit.sh options."
  - "Changing a workbook after setup: submit.sh reports which settings and stages change and applies the revision only with --accept-revision."
  - "Host and pathogen in the same libraries (Bulk RNA-seq only): choose yes for dual-organism intake, give the host genome and GTF as the custom reference, and fill the pathogen answers."
  - "Blank strandedness knowledge is not a reverse-stranded assumption: choose don't know. Salmon detects library type and reports disagreement. STAR requires a known declared strand; it does not infer strand."
  - "Do not change the field IDs in column E. Sorting complete rows and editing display labels do not change the field identities."
  - "Full intake and route coverage remains incomplete. See docs/INTAKE_TEMPLATE_AUDIT.md for required fields, implementation gaps and the v2 publication gate."

record_tables:
  Samples:
    columns: [sample_id, biological_unit_id, treatment, batch]
    help: "One biological sample per row. Add or rename covariate columns to match your primary factor and batch answers. Keep IDs as Text. Rows start at 5; append as needed."
  Libraries:
    columns: [library_id, sample_id, assay_family, layout, strandedness, umi, kit, platform, prep_batch]
    help: "One prepared library per sample in the current executable bulk route. Required: library_id, sample_id, assay_family=bulk, layout, strandedness, umi=no. Other columns record context."
    options:
      assay_family: [bulk]
      layout: [single, paired]
      strandedness: [unknown, unstranded, forward, reverse]
      umi: ['no', 'yes', unknown]
  Contrasts:
    columns: [contrast_id, factor, by, numerator, denominator, weights]
    help: "Optional. One comparison per row; blank tab uses generated pairwise contrasts. Pairwise: factor, optional by (within each level), numerator and denominator levels. Linear: weights only, e.g. treatmenttreated=1; sexM:treatmenttreated=1 (model coefficient names)."
  Reads:
    columns: [read_unit_id, library_id, role, uri, run, lane, bytes, checksum]
    help: "One gzip FASTQ file per row. Paired reads need R1 and R2 for each run/lane. URI is a path or URL; relative paths resolve beside this workbook. Bytes and SHA256 checksum are optional."
    options:
      role: [single, R1, R2]

common_questions:

  - id: metadata_source
    text: "Sample and read records"
    help: "External files: one read pair per sample. Workbook tables: fill Samples, Libraries, Reads; supports multiple runs/lanes. Clear external paths in table mode."
    type: dropdown
    options: [external files, workbook tables]
    default: external files
    required: true
    introduced_in: 3

  - id: project_name
    text: "Project name"
    help: "Folder name. Letters, numbers, underscores only. Example: chickpea_drought_2026"
    type: text
    required: true

  - id: contact_email
    text: "Contact email"
    help: "Recorded contact only; does not configure SLURM notifications. Example: you@example.edu"
    type: text
    required: false

  - id: biological_question
    text: "Biological question (one sentence)"
    help: "Saved as the project description. State the comparison you intend to make."
    type: text
    required: true

  - id: organism
    text: "Organism"
    help: "Common name, scientific name, or NCBI taxID. Examples: chickpea, Cicer arietinum, 3827"
    type: text
    required: true

  - id: tissue_type
    text: "Tissue type"
    help: "Example: leaf, root, blood, tumor. Recorded context; does not select tissue-specific QC thresholds."
    type: text
    required: false

  - id: platform
    text: "Sequencing platform"
    help: "Recorded context. Platform-specific preprocessing selection is not implemented."
    type: dropdown
    options: ["NovaSeq", "NextSeq", "MiSeq", "Other Illumina", "don't know"]
    required: true

  - id: primary_factor
    text: "Primary comparison — which column in your metadata file?"
    help: "Example: treatment, timepoint, genotype. This is what DE contrasts pivot around."
    type: text
    required: true

  - id: min_samples_per_group
    text: "Smallest group size (how many biological replicates in your smallest condition?)"
    help: "Checked against metadata group sizes. Sample count does not switch the current backend; scientific eligibility is checked separately."
    type: number
    required: true

  - id: repeated_measures
    text: "Same subject measured at multiple timepoints / conditions?"
    help: "Yes requires the Subject column answer below. Repeated rows of one subject are not independent replicates."
    type: dropdown
    options: ["yes", "no"]
    required: true
    default: "no"

  - id: batch_effect_column
    text: "Known batch column to model? (sequencing date, library prep batch, etc.)"
    help: "Type the column name from your metadata file, or 'none' if no known batches."
    type: text
    required: true
    default: "none"

  - id: fastq_path
    text: "FASTQ folder path (on analysis host)"
    help: "Folder on the analysis host. Example: /shared/projects/myproject/fastq"
    type: text
    required: true

  - id: metadata_file
    text: "Metadata file (CSV or Excel) — full path on analysis host"
    help: "One row per sample. Must contain a sample-ID column and your primary_factor column."
    type: text
    required: true

  - id: sample_id_column
    text: "Sample-ID column name in your metadata file"
    help: "The column that holds sample names matching the FASTQ filenames. Example: Sample"
    type: text
    required: true
    default: "sample_id"

  # Removed: probe_sample_id and run_probes_for_unknowns. They described a
  # separate probe-job mechanism that was never built. Salmon auto-detects the
  # library type during the normal quantification run, and 01_qc_quant.sh
  # records it and warns when it disagrees with samples.expected_libtype, so
  # there is nothing for a probe job to do.

  - id: expected_libtype
    text: "Expected library type, if you know it (e.g. ISR, SR, U)"
    help: "Optional. Salmon detects the library type itself during quantification; giving it here makes the pipeline warn you if the detected value disagrees. Leave blank to accept whatever Salmon finds."
    type: text
    required: false

  - id: run_enrichment
    text: "Run functional enrichment (GO + KEGG)?"
    help: "Yes adds Stage 4. Auto-skipped if OrgDb / KEGG code unavailable."
    type: dropdown
    options: ["yes", "no"]
    required: true
    default: "yes"

  - id: orgdb_strategy
    text: "How should the system get the OrgDb (for GO enrichment)?"
    help: "auto tries available annotation sources; force_build requests a build without guaranteeing coverage. use_existing requires explicit YAML configuration. skip requires enrichment=no. eggNOG is outside the qualified runtime."
    type: dropdown
    options: ["auto", "force_build", "use_existing", "skip"]
    required: true
    default: "auto"

  - id: orgdb_cache_dir
    text: "Where should built OrgDb packages be cached?"
    help: "Full path on the analysis host. Default ~/orgdb_cache/ is fine and per-user. For a lab-shared cache, use /group/<lab>/orgdb_cache/. Leave blank for default."
    type: text
    required: false
    default: "~/orgdb_cache"

  - id: run_wgcna
    text: "Run WGCNA co-expression network?"
    help: "Yes adds Stage 5. Auto-skipped if total samples < 15 (unreliable below that)."
    type: dropdown
    options: ["yes", "no"]
    required: true
    default: "yes"

  - id: analysis_goal
    text: Analysis goal
    help: QC only needs no reference or model. Expression only produces counts (and WGCNA if requested) without DE.
    type: dropdown
    options: [differential expression, expression only, QC only]
    default: differential expression
    required: false
    introduced_in: 5
  - id: analysis_backend
    text: Differential expression method
    help: auto follows the handbook default at setup (DESeq2 for 3-12 biological units per group, limma-voom above 12, dream with a random subject). Explicit methods keep the declared model.
    type: dropdown
    options:
    - auto
    - limma_voom
    - edger_ql
    - deseq2
    default: auto
    required: false
    introduced_in: 4
  - id: subject_column
    text: Subject column (repeated measures)
    help: Metadata column naming the donor/plant/animal measured repeatedly. Required when repeated measures is yes.
    type: text
    required: false
    introduced_in: 5
  - id: subject_model
    text: Subject effect
    help: random fits (1|subject) with dream. fixed block adds subject as a fixed term (paired designs) with any fixed-effect method.
    type: dropdown
    options: [random, fixed block]
    default: random
    required: false
    introduced_in: 5
  - id: model_formula
    text: Fixed-effects formula (optional)
    help: "Replaces the generated formula. Example: ~ batch + genotype * treatment + age. Must include the primary factor, batch and a fixed subject block when declared."
    type: text
    required: false
    introduced_in: 5
  - id: reference_genome
    text: Custom genome FASTA path or URL
    help: Optional custom reference set. With STAR, provide genome and GTF. With Salmon genomic decoys, also provide transcripts. Small-RNA plant routes need this and the GTF.
    type: text
    required: false
    introduced_in: 4
  - id: reference_gtf
    text: Custom annotation GTF path or URL
    help: Use the matching assembly/release. If any custom reference is supplied, provide the complete required set.
    type: text
    required: false
    introduced_in: 4


# -----------------------------------------------------------------------------
# Per-assay tabs. Each tab gets all common_questions PLUS its own extras.
# -----------------------------------------------------------------------------
tabs:

  # ============================ Bulk RNA-seq ============================
  - name: "Bulk RNA-seq"
    description: |
      Standard mRNA-seq for differential expression.
      Choose this tab if your library is polyA-selected OR ribodepletion.
      Reads can be single-end or paired-end.
    extra_questions:

      - id: library_type
        text: "Library prep type"
        help: "polyA = standard mRNA (default for healthy eukaryotic samples). ribodepletion = preserves all RNA classes including lncRNA, pre-mRNA, viral RNA."
        type: dropdown
        options: ["polyA mRNA-seq", "ribodepletion", "don't know"]
        required: true

      - id: read_config
        text: "Read configuration"
        help: "Look at your FASTQ files: if you have R1 and R2 per sample, it's paired-end."
        type: dropdown
        options: ["paired-end", "single-end", "don't know"]
        required: true

      - id: strandedness
        text: "Strandedness"
        help: "Use the protocol's declared orientation. If unresolved, choose don't know; do not infer orientation from kit age."
        type: dropdown
        options: ["reverse", "forward", "unstranded", "don't know"]
        required: true
        default: "don't know"

      - id: input_stage
        text: "Input processing stage"
        help: "Only raw FASTQ input is implemented. Counts/objects and instrument-level input need separate producers/import adapters."
        type: dropdown
        options: ["raw FASTQ", "counts or processed objects", "instrument raw data"]
        required: true
        introduced_in: 2

      - id: umi
        text: "Does the library contain UMIs?"
        help: "UMI extraction and deduplication are not implemented. Select no only after checking the protocol. Unknown status must be resolved."
        type: dropdown
        options: ["no", "yes", "don't know"]
        required: true
        introduced_in: 2

      - id: library_kit
        text: "Exact library kit and version"
        help: "Recorded context for reproducibility; it does not configure kit-specific processing in the current release."
        type: text
        required: false
        introduced_in: 2

  # ============================ TAGseq / 3'-tag ============================
      - id: analysis_quantifier
        text: Bulk quantification method
        help: auto selects Salmon for gene expression. STAR needs a compatible genome/GTF and known strand.
        type: dropdown
        options:
        - auto
        - salmon
        - star
        default: auto
        required: false
        introduced_in: 4
      - id: reference_transcriptome
        text: Custom transcriptome FASTA path or URL
        help: Salmon custom reference requires transcripts and GTF; genomic decoys additionally need genome. IDs must match annotation.
        type: text
        required: false
        introduced_in: 4
      - id: reference_decoys
        text: Salmon decoy profile
        help: genome is the new-project default. transcriptome only explicitly disables decoys. STAR does not use this setting.
        type: dropdown
        options:
        - genome
        - transcriptome only
        default: genome
        required: false
        introduced_in: 4
      - id: preprocess_poly_g
        text: Poly-G trimming
        help: auto uses fastp instrument-header detection. Choose on or off when the library protocol requires it.
        type: dropdown
        options:
        - auto
        - 'on'
        - 'off'
        default: auto
        required: false
        introduced_in: 4
      - id: preprocess_adapter_r1
        text: Explicit R1 adapter sequence
        help: Optional A/C/G/T sequence. Blank uses the bulk processor auto-detection. Kit-specific processing is not implied.
        type: text
        required: false
        introduced_in: 4
      - id: preprocess_adapter_r2
        text: Explicit R2 adapter sequence
        help: Paired reads only; also supply R1 adapter. Blank uses the R1 sequence when R1 is explicit.
        type: text
        required: false
        introduced_in: 4
      - id: preprocess_minimum_length
        text: Minimum retained read length (nt)
        help: Bulk minimum after processing. This is not a small-RNA size-selection profile.
        type: number
        maximum: 10000
        default: 15
        required: false
        introduced_in: 4
      - id: library_protocol
        text: Named library protocol
        help: Sets adapters and strand from a listed kit profile (config/kit_profiles.yaml). explicit uses the adapter and strand answers above.
        type: dropdown
        options: [explicit, TruSeq Stranded mRNA, TruSeq Stranded Total RNA, TruSeq RNA v2 (unstranded), NEBNext Ultra II Directional RNA, NEBNext Ultra II RNA (unstranded)]
        default: explicit
        required: false
        introduced_in: 5
      - id: screening
        text: Contamination screening
        help: yes screens a read sample against this project's transcriptome (expected), PhiX and any extra FASTA below. Reports only; never removes reads.
        type: dropdown
        options: ['no', 'yes']
        default: 'no'
        required: false
        introduced_in: 5
      - id: screening_extra
        text: Extra screening references
        help: "Optional name=FASTA path or URL pairs separated by ';'. Example: Botrytis=refs/botrytis.fa.gz"
        type: text
        required: false
        introduced_in: 5
      - id: screening_fragments
        text: Fragments screened per library
        help: Seeded random sample of read pairs/reads per library.
        type: number
        maximum: 10000000
        default: 100000
        required: false
        introduced_in: 5

      - id: dual_organism
        text: Host and pathogen in the same libraries
        help: "yes splits each read to the host or the pathogen by alignment to both genomes, then counts each on its own. The host is the organism above; give its genome and GTF in the custom reference answers, plus its transcripts if you use Salmon. Not for TAGseq or sRNA-seq."
        type: dropdown
        options: ['no', 'yes']
        default: 'no'
        required: false
        introduced_in: 8
      - id: pathogen_label
        text: Pathogen name (short label)
        help: "Required when host and pathogen is yes. Letters, digits, underscore, dot and hyphen only, and different from the host. Example: Botrytis"
        type: text
        required: false
        introduced_in: 8
      - id: pathogen_genome
        text: Pathogen genome FASTA path or URL
        help: Required when host and pathogen is yes.
        type: text
        required: false
        introduced_in: 8
      - id: pathogen_gtf
        text: Pathogen annotation GTF path or URL
        help: Required when host and pathogen is yes. The pathogen is counted against its own annotation.
        type: text
        required: false
        introduced_in: 8
      - id: pathogen_transcriptome
        text: Pathogen transcriptome FASTA path or URL
        help: Required when host and pathogen is yes and the quantification method is not star.
        type: text
        required: false
        introduced_in: 8
      - id: pathogen_objective
        text: Pathogen analysis
        help: counts only gives pathogen gene counts. differential expression also tests the pathogen between groups. Pathogen enrichment and co-expression are not available.
        type: dropdown
        options: [counts only, differential expression]
        default: counts only
        required: false
        introduced_in: 8
      - id: pathogen_min_reads
        text: Fewest pathogen reads for a sample to be analysed
        help: Samples with fewer reads assigned to the pathogen are left out of the pathogen analysis.
        type: number
        maximum: 1000000000
        default: 10000
        required: false
        introduced_in: 8

  - name: "TAGseq"
    description: |
      Lexogen QuantSeq 3'-tag RNA-seq. Launches through STAR for one of the
      three named, cited kit profiles (config/tagseq_kits.yaml). Strand,
      trimming and UMI handling come from the kit; do not set them separately.
    extra_questions:

      - id: read_config
        text: "Read configuration"
        help: "Named QuantSeq kits are single-end only."
        type: dropdown
        options: ["single-end", "paired-end", "don't know"]
        required: true
        default: "single-end"
        introduced_in: 7

      - id: kit
        text: "Library prep kit"
        help: "Exact QuantSeq profile (config/tagseq_kits.yaml). Strand and UMI handling come from the kit; don't know cannot launch this route."
        type: dropdown
        options: ["QuantSeq FWD", "QuantSeq REV", "QuantSeq FWD-UMI", "don't know"]
        required: true
        default: "don't know"

  # ============================ sRNA-seq ============================
  - name: "sRNA-seq"
    description: |
      Small RNA sequencing (miRNAs, siRNAs, viral siRNAs).
      Single-end, very short reads (typically SE50 or SE75).
      Launches the animal (Bowtie to species mature miRNAs) or plant
      (ShortStack loci on the genome) route with a named non-UMI kit.
    extra_questions:

      - id: read_config
        text: "Read configuration"
        help: "Small-RNA routes are single-end only."
        type: dropdown
        options: ["single-end", "paired-end", "don't know"]
        required: true
        default: "single-end"
        introduced_in: 6

      - id: adapter_kit
        text: "Small-RNA library kit (determines adapter sequence)"
        help: "Named non-UMI kits only (config/small_rna_kits.yaml). UMI kits (e.g. QIAseq miRNA) are blocked: UMI-aware counting is not implemented."
        type: dropdown
        options: ["TruSeq Small RNA", "QIAseq miRNA", "don't know"]
        required: true

      - id: small_rna_profile
        text: "Small-RNA profile"
        help: "animal: Bowtie to species mature miRNAs (needs mirbase_prefix below). plant: ShortStack loci on the genome (needs the genome FASTA above)."
        type: dropdown
        options: ["animal", "plant"]
        required: true
        introduced_in: 6

      - id: mirbase_prefix
        text: "miRBase species code (e.g. hsa, ath)"
        help: "Required for the animal profile. Optional for plant, but only together with a mature miRNA reference; leave both blank to skip known-miRNA annotation."
        type: text
        required: false
        introduced_in: 6

      - id: size_range
        text: "Expected sRNA size range (nt)"
        help: "Context only; recorded for reference. It does not change the kit's 18-30 nt length settings, even when it names a narrower window."
        type: dropdown
        options: ["18-30 (broad)", "20-22 (miRNA-focused)", "21-24 (plant siRNA)"]
        required: true
        default: "18-30 (broad)"
